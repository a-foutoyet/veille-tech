<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veille Tech — Aure</title>
  <style>
    /* ── THEME: Apple (défaut) — from design-apple.md ─────────────────── */
    :root, [data-theme="apple"] {
      /* Primary */
      --black: #000000;
      --near-black: #1d1d1f;
      --white: #ffffff;
      --blue: #0071e3;
      --blue-hover: #0077ed;
      --blue-light: #006edb;
      --blue-dark: #0076df;
      /* Neutrals */
      --light: #f5f5f7;
      --dark-charcoal: #272729;
      --charcoal: #333336;
      --mid-gray: #6e6e73;
      --dark-base: #18181a;
      /* Text */
      --text-secondary: #6e6e73;
      --text-tertiary: rgba(0,0,0,0.36);
      /* Surfaces */
      --nav-bg: rgba(0,0,0,0.8);
      --nav-text: rgba(255,255,255,0.8);
      --nav-sub: rgba(255,255,255,0.5);
      --hero-bg: #000000;
      --hero-text: #ffffff;
      --hero-sub: rgba(255,255,255,0.7);
      --body-bg: #f5f5f7;
      --card-bg: #ffffff;
      --card-border: none;
      --card-shadow: 0 0 0 0.5px rgba(0,0,0,0.06);
      --toolbar-border: rgba(0,0,0,0.1);
      --input-bg: #ffffff;
      --input-border: #ededf2;
      --tag-bg: rgba(0,113,227,0.08);
      --tag-color: #006edb;
      --badge-bg: rgba(0,0,0,0.04);
      --badge-color: #6e6e73;
      --green: #28a745;
      --gold: #d4a017;
      /* Typography */
      --font-display: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-body: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      /* Depth — Apple uses near-zero elevation */
      --dropdown-shadow: 0 2px 8px rgba(0,0,0,0.04);
      --card-hover-shadow: none;
      /* Border radius */
      --radius-card: 18px;
      --radius-input: 12px;
      --radius-btn: 980px;
      --radius-badge: 4px;
    }

    /* ── THEME: Vercel ──────────────────────────────────────────────────── */
    [data-theme="vercel"] {
      --black: #000000;
      --light: #fafafa;
      --near-black: #171717;
      --white: #ffffff;
      --blue: #000000;
      --blue-light: #171717;
      --blue-dark: #ffffff;
      --text-secondary: rgba(0,0,0,0.6);
      --text-tertiary: rgba(0,0,0,0.4);
      --card-shadow: rgba(0,0,0,0.08) 0px 2px 12px 0px;
      --green: #50e3c2;
      --gold: #f5a623;
      --nav-bg: rgba(255,255,255,0.8);
      --nav-text: #000000;
      --nav-sub: rgba(0,0,0,0.5);
      --hero-bg: #000000;
      --hero-text: #ffffff;
      --hero-sub: rgba(255,255,255,0.6);
      --body-bg: #fafafa;
      --card-bg: #ffffff;
      --card-border: 1px solid rgba(0,0,0,0.08);
      --toolbar-border: rgba(0,0,0,0.06);
      --input-bg: #ffffff;
      --input-border: rgba(0,0,0,0.15);
      --tag-bg: rgba(0,0,0,0.05);
      --tag-color: #171717;
      --badge-bg: rgba(0,0,0,0.05);
      --badge-color: rgba(0,0,0,0.5);
      --font-display: "Geist", "Inter", -apple-system, sans-serif;
      --font-body: "Geist", "Inter", -apple-system, sans-serif;
      --dropdown-shadow: 0 4px 20px rgba(0,0,0,0.08);
      --card-hover-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    /* ── THEME: Linear ──────────────────────────────────────────────────── */
    [data-theme="linear"] {
      --black: #0a0b0f;
      --light: #0f1117;
      --near-black: #e2e4ea;
      --white: #1a1c25;
      --blue: #5e6ad2;
      --blue-light: #5e6ad2;
      --blue-dark: #8b91e2;
      --text-secondary: rgba(226,228,234,0.56);
      --text-tertiary: rgba(226,228,234,0.36);
      --card-shadow: rgba(0,0,0,0.3) 0px 2px 16px 0px;
      --green: #4dba87;
      --gold: #f2c94c;
      --nav-bg: rgba(15,17,23,0.85);
      --nav-text: #e2e4ea;
      --nav-sub: rgba(226,228,234,0.4);
      --hero-bg: #0a0b0f;
      --hero-text: #e2e4ea;
      --hero-sub: rgba(226,228,234,0.5);
      --body-bg: #0f1117;
      --card-bg: #1a1c25;
      --card-border: 1px solid rgba(255,255,255,0.06);
      --toolbar-border: rgba(255,255,255,0.06);
      --input-bg: rgba(255,255,255,0.04);
      --input-border: rgba(255,255,255,0.1);
      --tag-bg: rgba(94,106,210,0.15);
      --tag-color: #8b91e2;
      --badge-bg: rgba(255,255,255,0.06);
      --badge-color: rgba(226,228,234,0.5);
      --font-display: "Inter", -apple-system, sans-serif;
      --font-body: "Inter", -apple-system, sans-serif;
      --dropdown-shadow: 0 4px 24px rgba(0,0,0,0.5);
      --card-hover-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    /* ── THEME: Stripe ──────────────────────────────────────────────────── */
    [data-theme="stripe"] {
      --black: #0a2540;
      --light: #f6f9fc;
      --near-black: #0a2540;
      --white: #ffffff;
      --blue: #635bff;
      --blue-light: #635bff;
      --blue-dark: #7a73ff;
      --text-secondary: rgba(10,37,64,0.55);
      --text-tertiary: rgba(10,37,64,0.35);
      --card-shadow: rgba(0,0,0,0.07) 0px 4px 20px 0px, rgba(0,0,0,0.04) 0px 0px 0px 1px;
      --green: #1ea672;
      --gold: #d97706;
      --nav-bg: rgba(10,37,64,0.95);
      --nav-text: #ffffff;
      --nav-sub: rgba(255,255,255,0.5);
      --hero-bg: #0a2540;
      --hero-text: #ffffff;
      --hero-sub: rgba(255,255,255,0.65);
      --body-bg: #f6f9fc;
      --card-bg: #ffffff;
      --card-border: none;
      --toolbar-border: rgba(10,37,64,0.08);
      --input-bg: #ffffff;
      --input-border: rgba(10,37,64,0.15);
      --tag-bg: rgba(99,91,255,0.08);
      --tag-color: #635bff;
      --badge-bg: rgba(10,37,64,0.06);
      --badge-color: rgba(10,37,64,0.5);
      --font-display: "Sohne", -apple-system, "Helvetica Neue", sans-serif;
      --font-body: "Sohne", -apple-system, "Helvetica Neue", sans-serif;
      --dropdown-shadow: 0 8px 40px rgba(0,0,0,0.12);
      --card-hover-shadow: 0 8px 40px rgba(0,0,0,0.1);
    }

    /* ── THEME: Notion ──────────────────────────────────────────────────── */
    [data-theme="notion"] {
      --black: #191919;
      --light: #ffffff;
      --near-black: #37352f;
      --white: #ffffff;
      --blue: #2eaadc;
      --blue-light: #2383a8;
      --blue-dark: #529CCA;
      --text-secondary: rgba(55,53,47,0.65);
      --text-tertiary: rgba(55,53,47,0.4);
      --card-shadow: rgba(0,0,0,0.04) 0px 1px 6px 0px;
      --green: #0f7b6c;
      --gold: #dfab01;
      --nav-bg: rgba(255,255,255,0.9);
      --nav-text: #37352f;
      --nav-sub: rgba(55,53,47,0.5);
      --hero-bg: #ffffff;
      --hero-text: #37352f;
      --hero-sub: rgba(55,53,47,0.6);
      --body-bg: #ffffff;
      --card-bg: #ffffff;
      --card-border: 1px solid rgba(55,53,47,0.09);
      --toolbar-border: rgba(55,53,47,0.09);
      --input-bg: #ffffff;
      --input-border: rgba(55,53,47,0.16);
      --tag-bg: rgba(35,131,168,0.07);
      --tag-color: #2383a8;
      --badge-bg: rgba(55,53,47,0.06);
      --badge-color: rgba(55,53,47,0.5);
      --font-display: "Lyon Display", Georgia, "Times New Roman", serif;
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --dropdown-shadow: 0 2px 12px rgba(0,0,0,0.08);
      --card-hover-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    /* ── THEME: Supabase ────────────────────────────────────────────────── */
    [data-theme="supabase"] {
      --black: #0f0f0f;
      --light: #131313;
      --near-black: #ededed;
      --white: #1c1c1c;
      --blue: #3ecf8e;
      --blue-light: #3ecf8e;
      --blue-dark: #6ee7b7;
      --text-secondary: rgba(237,237,237,0.56);
      --text-tertiary: rgba(237,237,237,0.36);
      --card-shadow: rgba(0,0,0,0.4) 0px 2px 16px 0px;
      --green: #3ecf8e;
      --gold: #f5c542;
      --nav-bg: rgba(15,15,15,0.85);
      --nav-text: #ededed;
      --nav-sub: rgba(237,237,237,0.4);
      --hero-bg: #0f0f0f;
      --hero-text: #ededed;
      --hero-sub: rgba(237,237,237,0.5);
      --body-bg: #131313;
      --card-bg: #1c1c1c;
      --card-border: 1px solid rgba(255,255,255,0.06);
      --toolbar-border: rgba(255,255,255,0.06);
      --input-bg: rgba(255,255,255,0.04);
      --input-border: rgba(255,255,255,0.1);
      --tag-bg: rgba(62,207,142,0.12);
      --tag-color: #3ecf8e;
      --badge-bg: rgba(255,255,255,0.06);
      --badge-color: rgba(237,237,237,0.5);
      --font-display: -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, sans-serif;
      --dropdown-shadow: 0 4px 24px rgba(0,0,0,0.5);
      --card-hover-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    /* ── THEME: SpaceX ──────────────────────────────────────────────────── */
    [data-theme="spacex"] {
      --black: #000000;
      --light: #0b0b0b;
      --near-black: #f0f0f0;
      --white: #141414;
      --blue: #005288;
      --blue-light: #005288;
      --blue-dark: #4da6e0;
      --text-secondary: rgba(240,240,240,0.56);
      --text-tertiary: rgba(240,240,240,0.36);
      --card-shadow: rgba(0,0,0,0.5) 0px 2px 20px 0px;
      --green: #28a745;
      --gold: #d4a017;
      --nav-bg: rgba(0,0,0,0.9);
      --nav-text: #f0f0f0;
      --nav-sub: rgba(240,240,240,0.4);
      --hero-bg: #000000;
      --hero-text: #f0f0f0;
      --hero-sub: rgba(240,240,240,0.5);
      --body-bg: #0b0b0b;
      --card-bg: #141414;
      --card-border: 1px solid rgba(255,255,255,0.05);
      --toolbar-border: rgba(255,255,255,0.05);
      --input-bg: rgba(255,255,255,0.04);
      --input-border: rgba(255,255,255,0.08);
      --tag-bg: rgba(0,82,136,0.2);
      --tag-color: #4da6e0;
      --badge-bg: rgba(255,255,255,0.06);
      --badge-color: rgba(240,240,240,0.5);
      --font-display: "D-DIN", "Barlow", -apple-system, sans-serif;
      --font-body: "D-DIN", "Barlow", -apple-system, sans-serif;
      --dropdown-shadow: 0 4px 24px rgba(0,0,0,0.6);
      --card-hover-shadow: 0 4px 24px rgba(0,0,0,0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--body-bg);
      color: var(--near-black);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* ── NAV ────────────────────────────────────────────────────────────── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 48px;
      background: var(--nav-bg);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      display: flex;
      align-items: center;
      padding: 0 22px;
      gap: 24px;
      transition: background 0.3s ease;
    }

    nav .nav-logo {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 600;
      color: var(--nav-text);
      letter-spacing: -0.374px;
      flex-shrink: 0;
    }

    nav .nav-sub {
      font-size: 12px;
      color: var(--nav-sub);
      font-weight: 400;
      letter-spacing: 0;
    }

    nav .nav-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* ── THEME SWITCHER ────────────────────────────────────────────────── */
    .theme-select {
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.8);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      padding-right: 22px;
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='rgba(255,255,255,0.5)' fill='none' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 8px center;
      transition: all 0.15s;
    }
    .theme-select:hover {
      border-color: rgba(255,255,255,0.3);
      background-color: rgba(255,255,255,0.12);
    }
    .theme-select option {
      background: #1a1a1a;
      color: #e0e0e0;
    }

    /* ── HERO ───────────────────────────────────────────────────────────── */
    .hero {
      background: var(--hero-bg);
      padding: 72px 22px 64px;
      text-align: center;
      transition: background 0.3s ease;
    }

    .hero h1 {
      font-family: var(--font-display);
      font-size: 56px;
      font-weight: 600;
      color: var(--hero-text);
      line-height: 1.07;
      letter-spacing: -0.28px;
      margin-bottom: 16px;
    }

    .hero p {
      font-size: 19px;
      font-weight: 400;
      color: var(--hero-sub);
      line-height: 1.47;
      letter-spacing: -0.374px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* ── TOOLBAR ────────────────────────────────────────────────────────── */
    .toolbar {
      background: var(--body-bg);
      padding: 20px 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .toolbar-wrap {
      background: var(--body-bg);
      border-bottom: 1px solid var(--toolbar-border);
      transition: background 0.3s ease;
    }

    .toolbar-label {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 400;
      letter-spacing: -0.12px;
    }

    .sort-btn {
      padding: 5px 13px;
      border-radius: 980px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-secondary);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
      letter-spacing: -0.08px;
    }

    .sort-btn:hover {
      border-color: var(--blue-light);
      color: var(--near-black);
    }

    .sort-btn.active {
      background: var(--blue);
      border-color: var(--blue);
      color: var(--white);
    }

    .sep {
      width: 1px;
      height: 18px;
      background: var(--toolbar-border);
      margin: 0 2px;
    }

    .search-input {
      margin-left: auto;
      padding: 7px 14px;
      border-radius: 11px;
      border: 1.5px solid var(--input-border);
      background: var(--input-bg);
      color: var(--near-black);
      font-size: 14px;
      font-family: inherit;
      width: 220px;
      outline: none;
      transition: border-color 0.15s;
      letter-spacing: -0.224px;
    }

    .search-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(0,113,227,0.15);
    }

    .search-input::placeholder { color: var(--text-tertiary); }

    .count-badge {
      background: var(--badge-bg);
      color: var(--badge-color);
      font-size: 12px;
      padding: 4px 11px;
      border-radius: 980px;
      letter-spacing: -0.08px;
    }

    /* ── DROPDOWNS ──────────────────────────────────────────────────────── */
    .dropdown {
      position: relative;
    }

    .dropdown-btn {
      padding: 5px 13px;
      border-radius: 11px;
      border: 1.5px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-secondary);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
      letter-spacing: -0.08px;
      white-space: nowrap;
      user-select: none;
    }

    .dropdown-btn:hover {
      border-color: rgba(0,0,0,0.25);
      color: var(--near-black);
    }

    .dropdown-btn.has-selection {
      border-color: var(--blue);
      color: var(--blue);
      background: rgba(0,113,227,0.04);
    }

    .dropdown-chevron {
      font-size: 9px;
      opacity: 0.5;
      transition: transform 0.15s;
    }

    .dropdown.open .dropdown-chevron {
      transform: rotate(180deg);
    }

    .dropdown-panel {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      background: var(--card-bg);
      border-radius: var(--radius-input, 12px);
      box-shadow: var(--dropdown-shadow, 0 4px 30px rgba(0,0,0,0.14));
      padding: 4px;
      z-index: 50;
      min-width: 220px;
      max-height: 300px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .dropdown.open .dropdown-panel {
      display: block;
    }

    .dropdown-panel::-webkit-scrollbar {
      width: 6px;
    }
    .dropdown-panel::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.15);
      border-radius: 3px;
    }

    .dropdown-item {
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--near-black);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.08s;
      letter-spacing: -0.08px;
    }

    .dropdown-item:hover {
      background: rgba(0,0,0,0.04);
    }

    .dropdown-item.selected {
      background: rgba(0,113,227,0.06);
    }

    .dropdown-check {
      width: 16px;
      height: 16px;
      border-radius: 5px;
      border: 1.5px solid rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      flex-shrink: 0;
      transition: all 0.1s;
      color: transparent;
    }

    .dropdown-item.selected .dropdown-check {
      background: var(--blue);
      border-color: var(--blue);
      color: var(--white);
    }

    .dropdown-count {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-tertiary);
    }

    .dropdown-reset {
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      color: var(--blue-light);
      cursor: pointer;
      text-align: center;
      border-top: 1px solid rgba(0,0,0,0.06);
      margin-top: 2px;
    }

    .dropdown-reset:hover {
      background: rgba(0,113,227,0.06);
    }

    /* ── GRID ───────────────────────────────────────────────────────────── */
    .grid-wrap {
      background: var(--body-bg);
      padding: 32px 22px 60px;
      transition: background 0.3s ease;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 18px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ── CARD ───────────────────────────────────────────────────────────── */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius-card, 18px);
      padding: 24px;
      box-shadow: var(--card-shadow);
      border: var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.3s ease;
      cursor: default;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--card-hover-shadow, 0 8px 40px rgba(0,0,0,0.12));
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .card-type-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .card-meta { flex: 1; min-width: 0; }

    .card-title {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      color: var(--near-black);
      line-height: 1.3;
      letter-spacing: -0.15px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-date-type {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .card-date {
      font-size: 12px;
      color: var(--text-tertiary);
      letter-spacing: -0.12px;
    }

    .card-type-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 980px;
      background: var(--badge-bg);
      color: var(--badge-color);
    }

    .card-score {
      font-size: 13px;
      letter-spacing: 1px;
      flex-shrink: 0;
    }

    .card-objectif {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.55;
      letter-spacing: -0.224px;
    }

    .card-points {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-points-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-tertiary);
      font-weight: 600;
    }

    .card-point {
      font-size: 13px;
      color: var(--text-secondary);
      padding-left: 14px;
      position: relative;
      line-height: 1.4;
      letter-spacing: -0.08px;
    }

    .card-point::before {
      content: '→';
      position: absolute;
      left: 0;
      color: var(--blue);
      font-size: 11px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid var(--toolbar-border);
      margin-top: auto;
    }

    .card-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .card-tag {
      font-size: 12px;
      padding: 2px 9px;
      border-radius: 980px;
      background: var(--tag-bg);
      color: var(--tag-color);
      cursor: pointer;
      transition: background 0.12s;
      letter-spacing: -0.08px;
    }

    .card-tag:hover { opacity: 0.8; }

    .card-link {
      color: var(--blue-light);
      font-size: 14px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 3px;
      letter-spacing: -0.1px;
      border: 1.5px solid var(--blue);
      padding: 6px 16px;
      border-radius: var(--radius-btn, 980px);
      transition: background-color 0.15s ease, color 0.15s ease;
      white-space: nowrap;
      font-weight: 400;
    }

    .card-link:hover {
      background: var(--blue);
      border-color: var(--blue);
      color: #ffffff;
    }

    /* Applicabilité au hover */
    .card-appli-wrap {
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .card:hover .card-appli-wrap { display: flex; }

    /* Tabs applicabilité */
    .card-appli-tabs {
      display: flex;
      gap: 4px;
    }

    .card-appli-tab {
      font-size: 11px;
      padding: 4px 11px;
      border-radius: 980px;
      border: 1px solid rgba(0,0,0,0.12);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      letter-spacing: -0.08px;
      transition: all 0.12s;
    }

    .card-appli-tab:hover { border-color: rgba(0,0,0,0.25); color: var(--near-black); }

    .card-appli-tab.tab-cinehome-active {
      background: rgba(0,0,0,0.05);
      border-color: rgba(0,0,0,0.2);
      color: var(--near-black);
    }

    .card-appli-tab.tab-equizio-active {
      background: rgba(0,0,0,0.05);
      border-color: rgba(0,0,0,0.2);
      color: var(--near-black);
    }

    .card-appli {
      font-size: 13px;
      line-height: 1.5;
      letter-spacing: -0.08px;
      padding: 10px 12px;
      border-radius: 10px;
    }

    .card-appli-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .card-appli-cinehome {
      color: var(--text-secondary);
      background: transparent;
    }
    .card-appli-cinehome .card-appli-label { color: var(--text-tertiary); }

    .card-appli-equizio {
      color: var(--text-secondary);
      background: transparent;
    }
    .card-appli-equizio .card-appli-label { color: var(--text-tertiary); }

    /* Sécurité badge */
    .card-secu {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 980px;
      letter-spacing: -0.08px;
      font-weight: 500;
    }
    .secu-safe { background: rgba(40,167,69,0.08); color: #1a6b3a; }
    .secu-vigilance { background: rgba(212,160,23,0.1); color: #8a6a00; }
    .secu-risk { background: rgba(220,53,69,0.08); color: #a01020; }

    /* ── TYPE ICONS ─────────────────────────────────────────────────────── */
    .type-github  { background: var(--badge-bg); }
    .type-article { background: var(--tag-bg); }
    .type-thread  { background: var(--badge-bg); }
    .type-outil   { background: var(--badge-bg); }
    .type-autre   { background: var(--badge-bg); }

    /* ── SCORE ──────────────────────────────────────────────────────────── */
    .score-5 { color: #d4a017; }
    .score-4 { color: #a08010; }
    .score-3 { color: var(--text-tertiary); }
    .score-2 { color: rgba(0,0,0,0.2); }

    /* ── EMPTY / LOADING ────────────────────────────────────────────────── */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 40px;
      color: var(--text-secondary);
      font-size: 17px;
      letter-spacing: -0.374px;
    }

    .empty code {
      color: var(--blue);
      font-family: "SF Mono", Menlo, Monaco, monospace;
      font-size: 14px;
      background: rgba(0,113,227,0.08);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: var(--text-secondary);
      font-size: 15px;
      letter-spacing: -0.374px;
    }

    /* ── RESPONSIVE ─────────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      .hero h1 { font-size: 36px; letter-spacing: -0.2px; }
      .hero p { font-size: 16px; }
      .hero { padding: 48px 16px 40px; }
      .toolbar, .tags-bar { padding-left: 16px; padding-right: 16px; }
      .grid-wrap { padding: 20px 16px 40px; }
      .grid { grid-template-columns: 1fr; gap: 14px; }
      .search-input { width: 100%; margin-left: 0; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <span class="nav-logo">Veille Tech</span>
  <span class="nav-sub" id="nav-count">Chargement…</span>
  <div class="nav-right">
    <select class="theme-select" id="theme-select" onchange="switchTheme(this.value)">
      <option value="apple">Apple</option>
      <option value="vercel">Vercel</option>
      <option value="linear">Linear</option>
      <option value="stripe">Stripe</option>
      <option value="notion">Notion</option>
      <option value="supabase">Supabase</option>
      <option value="spacex">SpaceX</option>
    </select>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <h1>Veille Tech</h1>
  <p id="subtitle">Chargement…</p>
</div>

<!-- TOOLBAR -->
<div class="toolbar-wrap">
  <div class="toolbar">
    <span class="toolbar-label">Trier</span>
    <button class="sort-btn active" data-sort="date">Date</button>
    <button class="sort-btn" data-sort="score">Note</button>
    <div class="sep"></div>
    <button class="sort-btn" data-sort="asc" id="order-btn">↑ Récent d'abord</button>
    <div class="sep" style="margin:0 4px"></div>
    <div class="dropdown" id="dropdown-type">
      <button class="dropdown-btn" onclick="toggleDropdown('dropdown-type')">Type <span class="dropdown-chevron">▾</span></button>
      <div class="dropdown-panel" id="panel-type"></div>
    </div>
    <div class="dropdown" id="dropdown-tags">
      <button class="dropdown-btn" onclick="toggleDropdown('dropdown-tags')">Tags <span class="dropdown-chevron">▾</span></button>
      <div class="dropdown-panel" id="panel-tags"></div>
    </div>
    <span class="count-badge" id="count-badge">—</span>
    <input class="search-input" type="text" id="search" placeholder="Rechercher…">
  </div>
</div>

<!-- GRID -->
<div class="grid-wrap">
  <div class="grid" id="grid">
    <div class="loading">Lecture du log…</div>
  </div>
</div>

<script>
  let allEntries = [];
  let currentSort = 'date';
  let sortAsc = false;
  let activeTags = new Set();
  let activeTypes = new Set();
  let searchTerm = '';

  // ── PARSER MARKDOWN ──────────────────────────────────────────────────────────
  function parseVeilleLog(md) {
    const entries = [];
    const sections = md.split(/\n(?=## \d{4}-\d{2}-\d{2} — )/);
    for (const section of sections) {
      if (!section.match(/^## \d{4}-\d{2}-\d{2}/)) continue;
      const entry = {};

      const headerMatch = section.match(/^## (\d{4}-\d{2}-\d{2}) — (.+)/);
      if (!headerMatch) continue;
      entry.date = headerMatch[1];
      entry.title = headerMatch[2].trim();

      const urlMatch = section.match(/\*\*URL\*\* : ([^\n]+)/);
      entry.url = urlMatch ? urlMatch[1].split(' ')[0].trim() : '#';

      const typeMatch = section.match(/\*\*Type\*\* : ([^\n]+)/);
      entry.type = typeMatch ? typeMatch[1].trim() : 'Autre';

      const scoreMatch = section.match(/\*\*Score\*\* : [⭐☆]+ \((\d)\/5\)/);
      entry.score = scoreMatch ? parseInt(scoreMatch[1]) : 0;
      const starsMatch = section.match(/\*\*Score\*\* : ([⭐☆]+)/);
      entry.stars = starsMatch ? starsMatch[1] : '';

      const tagsMatch = section.match(/\*\*Tags\*\* : ([^\n]+)/);
      entry.tags = tagsMatch
        ? tagsMatch[1].match(/`([^`]+)`/g)?.map(t => t.replace(/`/g, '')) || []
        : [];

      const objMatch = section.match(/### Objectif\n([\s\S]*?)(?=###|$)/);
      entry.objectif = objMatch ? objMatch[1].trim().replace(/\*\*/g, '') : '';

      const pointsMatch = section.match(/### Ce qu'il y a à garder\n([\s\S]*?)(?=###|$)/);
      if (pointsMatch) {
        entry.points = pointsMatch[1]
          .split('\n')
          .filter(l => l.match(/^- /))
          .slice(0, 4)
          .map(l => l.replace(/^- /, '').replace(/\*\*/g, '').split(' : ')[0]);
      } else {
        entry.points = [];
      }

      // Sécurité
      const secuMatch = section.match(/### Sécurité\n([\s\S]*?)(?=###|$)/);
      if (secuMatch) {
        const secuRaw = secuMatch[1].trim();
        const verdictMatch = secuRaw.match(/\*\*Verdict\*\*\s*:\s*([^\n]+)/);
        entry.secu_verdict = verdictMatch ? verdictMatch[1].replace(/\*\*/g, '').trim() : '';
        const licMatch = secuRaw.match(/\*\*Licence\*\*\s*:\s*([^\n]+)/);
        entry.secu_licence = licMatch ? licMatch[1].trim() : '';
      } else {
        entry.secu_verdict = '';
        entry.secu_licence = '';
      }

      // Support both old "Applicabilité projet" and new "Applicabilité projets"
      const appliMatch = section.match(/### Applicabilité projets?\n([\s\S]*?)(?=---|$)/);
      const appliRaw = appliMatch ? appliMatch[1].trim() : '';

      // Parse CinéHome and Equizio sub-sections
      const cinehomeMatch = appliRaw.match(/\*\*CinéHome\*\*\s*:\s*([\s\S]*?)(?=\*\*Equizio\*\*|$)/);
      const equizioMatch = appliRaw.match(/\*\*Equizio\*\*\s*:\s*([\s\S]*)/);

      entry.appli_cinehome = cinehomeMatch ? cinehomeMatch[1].trim().replace(/\*\*/g, '') : '';
      entry.appli_equizio = equizioMatch ? equizioMatch[1].trim().replace(/\*\*/g, '') : '';
      // Fallback: if no sub-sections, use the whole block as cinehome
      if (!cinehomeMatch && !equizioMatch && appliRaw) {
        entry.appli_cinehome = appliRaw.replace(/\*\*/g, '');
      }
      entry.appli = appliRaw.replace(/\*\*/g, '');

      entries.push(entry);
    }
    return entries;
  }

  // ── HTML ESCAPE ───────────────────────────────────────────────────────────────
  function esc(str) {
    if (!str) return '';
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── HELPERS ──────────────────────────────────────────────────────────────────
  function typeIcon(type) {
    const t = type.toLowerCase();
    if (t.includes('github')) return { icon: '⚙️', cls: 'type-github' };
    if (t.includes('article') || t.includes('newsletter')) return { icon: '📄', cls: 'type-article' };
    if (t.includes('thread') || t.includes('x ')) return { icon: '𝕏', cls: 'type-thread' };
    if (t.includes('outil') || t.includes('saas')) return { icon: '🔧', cls: 'type-outil' };
    return { icon: '📌', cls: 'type-autre' };
  }

  function scoreClass(n) {
    if (n >= 5) return 'score-5';
    if (n >= 4) return 'score-4';
    if (n >= 3) return 'score-3';
    return 'score-2';
  }

  function cleanUrl(url) {
    return url.replace('(article newsletter)', '').replace('(fil collé manuellement)', '').trim();
  }

  function shortType(type) {
    if (type.toLowerCase().includes('github')) return 'GitHub';
    if (type.toLowerCase().includes('newsletter')) return 'Newsletter';
    if (type.toLowerCase().includes('article')) return 'Article';
    if (type.toLowerCase().includes('thread')) return 'Thread X';
    if (type.toLowerCase().includes('mcp')) return 'MCP Server';
    return type.split('/')[0].trim();
  }

  // ── DROPDOWNS ─────────────────────────────────────────────────────────────────
  function toggleDropdown(id) {
    const el = document.getElementById(id);
    const wasOpen = el.classList.contains('open');
    document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
    if (!wasOpen) el.classList.add('open');
  }

  document.addEventListener('click', e => {
    if (!e.target.closest('.dropdown')) {
      document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
    }
  });

  function renderDropdowns() {
    // Type dropdown
    const typeCounts = {};
    for (const e of allEntries) {
      const t = shortType(e.type);
      typeCounts[t] = (typeCounts[t] || 0) + 1;
    }
    const typePanel = document.getElementById('panel-type');
    typePanel.innerHTML = Object.entries(typeCounts).sort((a,b) => b[1]-a[1]).map(([type, count]) => {
      const sel = activeTypes.has(type) ? ' selected' : '';
      return `<div class="dropdown-item${sel}" onclick="toggleType('${esc(type)}')"><span class="dropdown-check">✓</span>${esc(type)}<span class="dropdown-count">${count}</span></div>`;
    }).join('') + (activeTypes.size ? '<div class="dropdown-reset" onclick="resetTypes()">Effacer</div>' : '');

    const typeBtn = document.querySelector('#dropdown-type .dropdown-btn');
    if (activeTypes.size === 0) {
      typeBtn.innerHTML = 'Type <span class="dropdown-chevron">▾</span>';
      typeBtn.classList.remove('has-selection');
    } else {
      typeBtn.innerHTML = `Type (${activeTypes.size}) <span class="dropdown-chevron">▾</span>`;
      typeBtn.classList.add('has-selection');
    }

    // Tags dropdown
    const tagCounts = {};
    for (const e of allEntries) {
      for (const t of e.tags) tagCounts[t] = (tagCounts[t] || 0) + 1;
    }
    const tagsPanel = document.getElementById('panel-tags');
    tagsPanel.innerHTML = Object.entries(tagCounts).sort((a,b) => b[1]-a[1]).map(([tag, count]) => {
      const sel = activeTags.has(tag) ? ' selected' : '';
      return `<div class="dropdown-item${sel}" onclick="toggleTagFilter('${esc(tag)}')"><span class="dropdown-check">✓</span>${esc(tag)}<span class="dropdown-count">${count}</span></div>`;
    }).join('') + (activeTags.size ? '<div class="dropdown-reset" onclick="resetTags()">Effacer</div>' : '');

    const tagsBtn = document.querySelector('#dropdown-tags .dropdown-btn');
    if (activeTags.size === 0) {
      tagsBtn.innerHTML = 'Tags <span class="dropdown-chevron">▾</span>';
      tagsBtn.classList.remove('has-selection');
    } else {
      tagsBtn.innerHTML = `Tags (${activeTags.size}) <span class="dropdown-chevron">▾</span>`;
      tagsBtn.classList.add('has-selection');
    }
  }

  function toggleType(type) { activeTypes.has(type) ? activeTypes.delete(type) : activeTypes.add(type); render(); }
  function toggleTagFilter(tag) { activeTags.has(tag) ? activeTags.delete(tag) : activeTags.add(tag); render(); }
  function resetTypes() { activeTypes.clear(); render(); }
  function resetTags() { activeTags.clear(); render(); }

  function renderCards(entries) {
    const grid = document.getElementById('grid');

    if (entries.length === 0) {
      grid.innerHTML = '<div class="empty">Aucun résultat trouvé.</div>';
      return;
    }

    grid.innerHTML = entries.map(e => {
      const { icon, cls } = typeIcon(e.type);
      const url = cleanUrl(e.url);
      const points = e.points.slice(0, 4).map(p => {
        return `<div class="card-point">${esc(p)}</div>`;
      }).join('');

      const objectifTxt = esc(e.objectif);
      const cinehomeTxt = esc(e.appli_cinehome || '');
      const equizioTxt = esc(e.appli_equizio || '');

      let secuBadge = '';
      if (e.secu_verdict) {
        const v = e.secu_verdict;
        if (v.includes('🟢')) secuBadge = `<span class="card-secu secu-safe">🟢 Safe</span>`;
        else if (v.includes('🟡')) secuBadge = `<span class="card-secu secu-vigilance">🟡 Vigilance</span>`;
        else if (v.includes('🔴')) secuBadge = `<span class="card-secu secu-risk">🔴 Risque</span>`;
      }

      return `
        <div class="card">
          <div class="card-header">
            <div class="card-type-icon ${cls}">${icon}</div>
            <div class="card-meta">
              <div class="card-title" title="${esc(e.title)}">${esc(e.title)}</div>
              <div class="card-date-type">
                <span class="card-date">${e.date}</span>
                <span class="card-type-badge">${esc(shortType(e.type))}</span>
                ${secuBadge}
              </div>
            </div>
            <div class="card-score ${scoreClass(e.score)}">${e.stars}</div>
          </div>
          ${e.objectif ? `<div class="card-objectif">${objectifTxt}</div>` : ''}
          ${points ? `<div class="card-points"><div class="card-points-title">À garder</div>${points}</div>` : ''}
          ${(cinehomeTxt || equizioTxt) ? `<div class="card-appli-wrap">
            ${(cinehomeTxt && equizioTxt) ? `<div class="card-appli-tabs">
              <button class="card-appli-tab tab-cinehome-active" onclick="switchAppliTab(this,'cinehome')">CinéHome</button>
              <button class="card-appli-tab" onclick="switchAppliTab(this,'equizio')">Equizio</button>
            </div>` : ''}
            ${cinehomeTxt ? `<div class="card-appli card-appli-cinehome" data-tab="cinehome"><div class="card-appli-label">CinéHome</div>${cinehomeTxt}</div>` : ''}
            ${equizioTxt ? `<div class="card-appli card-appli-equizio" data-tab="equizio" style="${cinehomeTxt ? 'display:none' : ''}"><div class="card-appli-label">Equizio</div>${equizioTxt}</div>` : ''}
          </div>` : ''}
          <div class="card-footer">
            <div class="card-tags">
              ${e.tags.map(t => `<span class="card-tag" onclick="filterTag('${esc(t)}')">#${esc(t)}</span>`).join('')}
            </div>
            ${url !== '#' ? `<a class="card-link" href="${esc(url)}" target="_blank">Voir ↗</a>` : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  function filterTag(tag) {
    activeTags.has(tag) ? activeTags.delete(tag) : activeTags.add(tag);
    render();
  }

  function render() {
    let entries = [...allEntries];

    if (searchTerm) {
      const q = searchTerm.toLowerCase();
      entries = entries.filter(e =>
        e.title.toLowerCase().includes(q) ||
        e.objectif.toLowerCase().includes(q) ||
        e.tags.some(t => t.toLowerCase().includes(q)) ||
        e.type.toLowerCase().includes(q)
      );
    }

    if (activeTypes.size) entries = entries.filter(e => activeTypes.has(shortType(e.type)));
    if (activeTags.size) entries = entries.filter(e => e.tags.some(t => activeTags.has(t)));

    entries.sort((a, b) => {
      let cmp = 0;
      if (currentSort === 'date') cmp = a.date.localeCompare(b.date);
      else if (currentSort === 'score') cmp = a.score - b.score;
      else if (currentSort === 'type') cmp = a.type.localeCompare(b.type);
      return sortAsc ? cmp : -cmp;
    });

    const badge = `${entries.length} entrée${entries.length > 1 ? 's' : ''}`;
    document.getElementById('count-badge').textContent = badge;
    document.getElementById('nav-count').textContent = badge;
    renderDropdowns();
    renderCards(entries);
  }

  // ── INIT ──────────────────────────────────────────────────────────────────────
  async function init() {
    try {
      const res = await fetch('veille-log.md');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const md = await res.text();
      allEntries = parseVeilleLog(md);
      const sub = `${allEntries.length} ressources loggées — mis à jour automatiquement`;
      document.getElementById('subtitle').textContent = sub;
      render();
    } catch (err) {
      document.getElementById('grid').innerHTML =
        `<div class="empty">Impossible de charger veille-log.md<br><small style="color:rgba(0,0,0,0.4);margin-top:12px;display:block;font-size:14px">Lance un serveur local : <code>python3 -m http.server 8080</code></small></div>`;
    }
  }

  document.querySelectorAll('.sort-btn[data-sort]').forEach(btn => {
    if (btn.id === 'order-btn') return;
    btn.addEventListener('click', () => {
      document.querySelectorAll('.sort-btn[data-sort]').forEach(b => {
        if (b.id !== 'order-btn') b.classList.remove('active');
      });
      btn.classList.add('active');
      currentSort = btn.dataset.sort;
      render();
    });
  });

  document.getElementById('order-btn').addEventListener('click', function() {
    sortAsc = !sortAsc;
    this.textContent = sortAsc ? '↑ Ancien d\'abord' : '↑ Récent d\'abord';
    this.classList.toggle('active', sortAsc);
    render();
  });

  document.getElementById('search').addEventListener('input', e => {
    searchTerm = e.target.value.trim();
    render();
  });

  function switchAppliTab(btn, tabName) {
    const wrap = btn.closest('.card-appli-wrap');
    wrap.querySelectorAll('[data-tab]').forEach(el => el.style.display = 'none');
    wrap.querySelector(`[data-tab="${tabName}"]`).style.display = 'block';
    wrap.querySelectorAll('.card-appli-tab').forEach(b => {
      b.className = 'card-appli-tab';
    });
    btn.classList.add(`tab-${tabName}-active`);
  }

  // ── THEME SWITCHER ──────────────────────────────────────────────────────────
  function switchTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('veille-theme', theme);
    document.getElementById('theme-select').value = theme;
  }

  // Restore saved theme
  const savedTheme = localStorage.getItem('veille-theme');
  if (savedTheme) {
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.getElementById('theme-select').value = savedTheme;
  }

  window.filterTag = filterTag;
  window.switchAppliTab = switchAppliTab;
  window.switchTheme = switchTheme;
  window.toggleDropdown = toggleDropdown;
  window.toggleType = toggleType;
  window.toggleTagFilter = toggleTagFilter;
  window.resetTypes = resetTypes;
  window.resetTags = resetTags;
  init();
</script>
</body>
</html>
